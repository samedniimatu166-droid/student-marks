<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f3f6fb; color: #172033; }
    main { max-width: 560px; margin: 40px auto; padding: 28px; background: white; border-radius: 14px; box-shadow: 0 8px 28px rgba(20,35,60,.10); }
    h1 { margin-top: 0; font-size: 1.7rem; }
    p { line-height: 1.5; color: #4b5563; }
    label { display: block; margin: 18px 0 8px; font-weight: bold; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    button { margin-top: 16px; padding: 12px 16px; border: 0; border-radius: 8px; background: #2457d6; color: white; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1945b5; }
    .results { margin-top: 22px; padding: 16px; background: #f8fafc; border-radius: 8px; }
    .results p { margin: 8px 0; color: #172033; }
    .error { color: #b42318 !important; }
  </style>
</head>
<body>
  <main>
    <h1>Student Marks Calculator</h1>
    <p>Enter marks separated by commas. The calculator displays the average, highest, and lowest marks.</p>
    <label for="marks">Student marks (0–100)</label>
    <input id="marks" type="text" value="75, 82, 48, 90, 67" placeholder="e.g. 75, 82, 48, 90, 67">
    <button type="button" id="calculate">Calculate Results</button>
    <section class="results" aria-live="polite">
      <p id="average">Average: 72.4</p>
      <p id="highest">Highest: 90</p>
      <p id="lowest">Lowest: 48</p>
      <p id="message"></p>
    </section>
  </main>
  <script>
    function calculateMarks() {
      const input = document.getElementById('marks').value.trim();
      const message = document.getElementById('message');
      if (!input) { showError('Please enter at least one mark.'); return; }
      const parts = input.split(',').map(value => value.trim());
      const marks = parts.map(value => Number(value));
      if (parts.some(value => value === '') || marks.some(mark => !Number.isFinite(mark) || mark < 0 || mark > 100)) {
        showError('Enter valid marks from 0 to 100, separated by commas.');
        return;
      }
      const total = marks.reduce((sum, mark) => sum + mark, 0);
      document.getElementById('average').textContent = 'Average: ' + Number((total / marks.length).toFixed(2));
      document.getElementById('highest').textContent = 'Highest: ' + Math.max(...marks);
      document.getElementById('lowest').textContent = 'Lowest: ' + Math.min(...marks);
      message.className = '';
      message.textContent = 'Results calculated for ' + marks.length + ' student(s).';
    }
    function showError(text) {
      const message = document.getElementById('message');
      message.className = 'error';
      message.textContent = text;
    }
    document.getElementById('calculate').addEventListener('click', calculateMarks);
    calculateMarks();
  </script>
</body>
</html>
